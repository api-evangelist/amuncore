description: >-
  AmunCore versions its generated API in the URI path at v1 and nothing else about
  its lifecycle is published. There is no changelog, no status page, no deprecation
  policy and no numeric uptime commitment outside a negotiated Enterprise SLA. For
  a platform whose whole value proposition is "we maintain the API layer so you
  don't", the absence of a public change and status record is the most consequential
  gap in this profile.
