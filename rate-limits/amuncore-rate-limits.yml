- https://amuncore.com/openapi.json
headers:
  limit: X-RateLimit-Limit
  remaining: X-RateLimit-Remaining
  reset: X-RateLimit-Reset
  retry_after: Retry-After
  note: >-
    The OpenAPI description states responses "may include" the three X-RateLimit-*
    headers; llms.txt states the 429 response includes Retry-After. None were
    observed on the unauthenticated probes, since those never reached a metered
    endpoint.
