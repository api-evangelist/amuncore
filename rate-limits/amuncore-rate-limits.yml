description: >-
  AmunCore rate-limits by billing-period call quota rather than by requests per
  second. The quota is attached to the plan — a daily allowance on the free tier
  and a monthly allowance on the paid tiers — and exhausting it returns 429 with a
  Retry-After header. Per-application IP allowlisting and "rate limits" are also
  listed as platform features, but no per-second or burst figure is published.
