introspection:
  tool: check_plan_limits
  transport: mcp
  note: >-
    The MCP surface exposes check_plan_limits and get_license_status, so an agent
    can read remaining quota before spending it rather than discovering exhaustion
    at the 429. That is a genuinely good agent affordance; there is no REST
    equivalent.
gaps:
- No per-second or burst limit is published, so a client cannot tell how fast it
  may drain its monthly quota.
- Quota is per account, not per application or per key, so one noisy consumer's
  key can exhaust the allowance for every other consumer of the same account.
- The X-RateLimit-* headers are documented as conditional ("may include"), which
  means an agent cannot rely on them for pacing.
