name: AmunCore
description: 'AmunCore turns a database into a secure REST API without writing a backend. You connect
  a database, pick tables, and endpoints go live with routing, authentication, validation, pagination,
  joins, errors, logs and docs already handled — the layer between a database and HTTP that would otherwise
  be a two-to-six-week project. It supports SQL Server, MySQL, MariaDB, PostgreSQL, Oracle and SQLite,
  with a visual builder that is the same regardless of the engine underneath. It is MCP-native by design:
  the endpoints you build become tools an AI assistant can call under the same keys, permissions and audit
  trail, and the MCP endpoint is live and token-gated. Full CRUD, a free plan, and Bearer API keys.'
