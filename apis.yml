X-Discovery:
  date: '2026-08-03'
  method: probed
  note: Found while researching a separate company and profiled on its own merits. Everything below was
    fetched.
  findings:
  - surface: Website
    url: https://amuncore.com
    http_status: 200
    real: true
  - surface: MCPServer
    url: https://amuncore.com/mcp
    http_status: 401
    real: true
    note: 'Real and well built. GET returns 405; POST jsonrpc returns a correct JSON-RPC error -32001
      "Unauthorized: missing MCP-Token header" rather than an HTML page.'
  - surface: OpenAPI
    url: https://amuncore.com/openapi.json
    http_status: 404
    real: false
    note: 'SUPERSEDED — see the 2026-08-10 re-probe below. On 2026-08-03 none was published for the platform
      itself. Note the product GENERATES APIs per tenant, so a platform-level spec is a different thing
      from the specs it produces.'
  - surface: LlmsTxt
    url: https://amuncore.com/llms.txt
    http_status: 404
    real: false
    note: SUPERSEDED — see the 2026-08-10 re-probe below.
  - surface: Control
    url: https://amuncore.com/zzz-control-nonsense
    http_status: 404
    real: false
    note: Control path correctly 404s — no SPA catch-all, so the probes above are trustworthy.
X-Reprobe:
  date: '2026-08-10'
  method: probed
  note: >-
    Re-probed on the second enrichment pass. AmunCore shipped a machine-readable contract surface in
    the seven days after first profiling: the OpenAPI, llms.txt and both OAuth discovery documents were
    all 404 on 2026-08-03 and are all 200 now. The 2026-08-03 findings above are kept for the record and
    marked SUPERSEDED rather than rewritten. Note this also means the provider changed its public contract
    with no changelog and no status page to announce it.
  findings:
  - surface: OpenAPI
    url: https://amuncore.com/openapi.json
    http_status: 200
    real: true
    note: OpenAPI 3.0.1, 5 operations over 2 paths, X-Api-Key security scheme, examples on all 30 responses.
      Byte-identical mirror at https://amuncore.com/swagger/v1/swagger.json.
  - surface: APIReference
    url: https://amuncore.com/swagger
    http_status: 200
    real: true
    note: Public Swagger UI, no sign-in required.
  - surface: LlmsTxt
    url: https://amuncore.com/llms.txt
    http_status: 200
    real: true
    note: 6.2KB, well-formed, and it publishes the twelve MCP tool names — the only anonymous route to
      the tool list, since tools/list itself is gated.
  - surface: WellKnown
    url: https://amuncore.com/.well-known/oauth-authorization-server
    http_status: 200
    real: true
    note: RFC 8414 metadata — authorization_code + refresh_token, PKCE S256 only, RFC 7591 dynamic client
      registration, single scope "mcp".
  - surface: WellKnown
    url: https://amuncore.com/.well-known/oauth-protected-resource
    http_status: 200
    real: true
    note: RFC 9728 metadata naming https://amuncore.com/mcp as the protected resource; the MCP 401 now
      carries the matching WWW-Authenticate Bearer challenge.
  - surface: AgentCard
    url: https://amuncore.com/.well-known/agent-card.json
    http_status: 404
    real: false
    note: Legacy /.well-known/agent.json also 404. No A2A agent card, so nothing was written to a2a/.
  - surface: SecurityTxt
    url: https://amuncore.com/.well-known/security.txt
    http_status: 404
    real: false
  - surface: GraphQL
    url: https://amuncore.com/graphql
    http_status: 404
    real: false
    note: security.html documents a GraphQL channel, but /graphql, /api/graphql and /api/v1/graphql all
      404 — the GraphQL surface is generated per tenant, not served at the platform root.
  - surface: StatusPage
    url: https://status.amuncore.com/
    http_status: 0
    real: false
    note: DNS does not resolve. /changelog and /pricing also 404 — no status page, no changelog, and no
      standalone pricing route.
