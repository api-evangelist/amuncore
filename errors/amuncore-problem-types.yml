gaps:
- No 403. Authorization failures (a read-only key attempting a write, an IP outside
  the allowlist) are not given a distinct documented status; only 401 appears in
  the spec.
- POST declares no 404 and no 500, and the write operations declare no 503, so the
  documented response set is not uniform across verbs.
- No error type URIs and no error-reference page, so the codes above are only
  discoverable from the OpenAPI examples and llms.txt.
- Errors are documented as inline examples on each response rather than as a named
