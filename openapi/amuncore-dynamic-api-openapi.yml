components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      description: Your application's API key. Sent on every request as the X-Api-Key header. A missing or invalid key returns
        401.
      name: X-Api-Key
      in: header
security:
- ApiKeyAuth: []
tags:
- name: Dynamic API
  description: Generated CRUD over a table or view exposed as an endpoint on a registered AmunCore application.
