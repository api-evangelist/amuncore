status: published
provider_published: true
source: https://amuncore.com/mcp
docs: https://amuncore.com/llms.txt
description: 'AmunCore is MCP-native by design: the REST endpoints a user builds over their own database
  become tools an AI assistant can call, under the same keys, permissions and audit trail. The MCP endpoint
  is live and token-gated — it answers JSON-RPC with a well-formed protocol error rather than an HTML
  page, which is a good sign of a real implementation rather than a marketing route. Since the first profiling
  round the provider has added RFC 9728 protected resource metadata and a matching WWW-Authenticate challenge,
  so an agent can now discover how to authorize without being told out of band.'
verified: '2026-08-10'
server:
  name: amuncore
  transport:
  - http
  - stdio
  url: https://amuncore.com/mcp
  auth: MCP-Token header, or OAuth 2.0 bearer token with the "mcp" scope
  deployment: vendor-hosted
  scope_model: One MCP configuration per company. Tools are scoped to the company that owns the key, with
    the same tenant isolation and audit logging as the REST API.
  transports_note: llms.txt documents both a local stdio transport (for desktop assistants such as Claude
    Desktop) and the HTTP transport probed here.
authorization:
  challenge: 'WWW-Authenticate: Bearer resource_metadata="https://amuncore.com/.well-known/oauth-protected-resource"'
  protected_resource_metadata: https://amuncore.com/.well-known/oauth-protected-resource
  authorization_server_metadata: https://amuncore.com/.well-known/oauth-authorization-server
  scopes:
  - mcp
  detail: scopes/amuncore-scopes.yml
tools_source: https://amuncore.com/llms.txt
