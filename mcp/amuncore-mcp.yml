gaps:
- Live tools/list is auth-gated, so the per-tool inputSchema could not be read. The names and descriptions
  above come from the provider's own llms.txt; input contracts require authenticated introspection.
- The exposed data surface is per-tenant by design. Eleven of the twelve tools are fixed platform-management
  tools, but call_api fans out to whatever endpoints a given company has built, so the effective tool
  surface differs per account.
