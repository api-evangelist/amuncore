- name: list_endpoints
  description: List the endpoints of an application.
- name: call_api
  description: Read or write data through any of your endpoints. The main data tool — this is the generic
    passthrough onto the generated REST surface.
- name: create_application
  description: Create a new application.
- name: create_endpoint
  description: Create a new endpoint on an application.
- name: toggle_endpoint
  description: Enable or disable an endpoint.
- name: regenerate_api_key
  description: Rotate an application's API key.
- name: get_audit_logs
  description: Read the audit trail.
- name: get_license_status
  description: Check the current plan and license.
- name: check_plan_limits
  description: Check plan limits and current usage.
- name: get_dashboard_stats
  description: Get summary statistics.
