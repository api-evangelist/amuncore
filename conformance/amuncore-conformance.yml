compliance_note: >-
  AmunCore publishes NO third-party certifications and is refreshingly direct
  about it. Its security page carries an "Honest roadmap" section stating that
  independent penetration testing and ISO 27001 alignment are not yet implemented,
  alongside SSO and SIEM export. No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or
  GDPR attestation is claimed anywhere on the site, so no Compliance pointer is
  emitted for this provider — the artifact records the honest absence instead.
