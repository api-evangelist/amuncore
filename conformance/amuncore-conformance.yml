description: >-
  What AmunCore actually conforms to, checked against fetched documents rather
  than claims. The standards posture is stronger on the agent side than the REST
  side: the MCP endpoint is fronted by a correct, discoverable OAuth 2.0
  authorization surface (RFC 8414 + RFC 9728 + PKCE + dynamic client
  registration), while the REST API is a plain API-key contract with a custom
  error envelope rather than problem+json.
