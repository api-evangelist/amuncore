description: >-
  AmunCore publishes no client libraries in any public package registry. This is a
  recorded absence, not an unchecked one — eleven registry lookups and an npm
  full-text search were run on 2026-08-10 and every one missed. The gap is by
  design rather than neglect: AmunCore's developer story is generated code
  SNIPPETS per endpoint (cURL, JavaScript, Python, C#, PHP, Go) exported from the
  dashboard, not a versioned SDK. That is a defensible choice for a platform whose
  endpoints differ per tenant, but it means there is nothing to pin, nothing to
  version, and no dated release signal for a consumer to read.
