description: >-
  Four published tiers, freemium with a permanent free plan and a self-serve card
  path into two flat monthly prices before an Enterprise "contact sales" step.
  What is metered is unusual and worth reading carefully: the plan gates not only
  call volume but WHICH DATABASE ENGINES you may connect — the free plan is SQL
  Server only, Starter adds MySQL, and only Pro unlocks every supported engine.
  AI/MCP access is likewise a paid feature, listed as available on Pro and marked
  with a neutral dot rather than a tick on Free and Starter.
